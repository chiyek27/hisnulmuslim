<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="hisnulmuslim.png" type="image/x-icon">
<title>حصن المسلم — Hisnul Muslim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e2a33;
    --ink-2:#123543;
    --panel:#123a46;
    --panel-line:#1f5566;
    --gold:#3fa4a0;
    --gold-soft:#2f8985;
    --rubric:#1c7d78;
    --parchment:#f5f9f6;
    --parchment-2:#e7f1ec;
    --ink-text:#12302c;
    --soft-text:#eaf6f4;
    --muted-text:#9dc4c0;
    --font-ar:"Scheherazade New",'Amiri', serif;
    --font-ui:'Inter', sans-serif;
    --font-id:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--soft-text);
    font-family:var(--font-ui);
    overflow:hidden;
  }
  ::selection{background:var(--gold-soft);color:#fff;}

  /* ---------- LOGIN SCREEN ---------- */
  #loginScreen{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);
    z-index:100;
    padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:4px;
    padding:38px 34px 30px;
    position:relative;
    box-shadow:0 20px 45px rgba(0,0,0,.12);
  }
  .login-card::before{
    content:"";
    position:absolute;inset:8px;
    border:1px solid var(--gold-soft);
    border-radius:2px;
    pointer-events:none;
    opacity:.55;
  }
  .login-medallion{width:56px;height:56px;margin:0 auto 18px;display:block;}
  .login-card h1{
    font-family:var(--font-ar);font-size:2rem;text-align:center;
    color:var(--parchment);margin:0 0 2px;direction:rtl;font-weight:700;
  }
  .login-card p.sub{
    text-align:center;font-family:var(--font-id);font-size:.82rem;
    color:var(--muted-text);margin:0 0 26px;letter-spacing:.02em;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:.72rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--muted-text);margin-bottom:6px;
  }
  .field input{
    width:100%;padding:11px 12px;background:var(--ink-2);
    border:1px solid var(--panel-line);border-radius:3px;
    color:var(--parchment);font-family:var(--font-ui);font-size:.95rem;
    outline:none;transition:border-color .15s;
  }
  .field input:focus{border-color:var(--gold);}
  #loginBtn{
    width:100%;margin-top:10px;padding:12px;background:var(--gold);
    color:#062522;border:none;border-radius:3px;
    font-family:var(--font-ui);font-weight:600;font-size:.92rem;
    letter-spacing:.02em;cursor:pointer;transition:background .15s;
  }
  #loginBtn:hover{background:#5cc0bc;}
  #loginError{
    color:#e0938a;font-size:.8rem;text-align:center;
    margin-top:12px;min-height:1em;font-family:var(--font-ui);
  }
  .login-hint{
    margin-top:22px;padding-top:16px;border-top:1px dashed var(--panel-line);
    font-size:.72rem;color:var(--muted-text);text-align:center;line-height:1.7;
  }
  .login-hint b{color:var(--gold);}

  /* ---------- APP SHELL ---------- */
  #app{display:none;height:100vh;}
  #app.active{display:flex;flex-direction:column;}

  .topbar{
    height:56px;flex:0 0 auto;display:flex;align-items:center;gap:12px;
    padding:0 16px;background:var(--panel);border-bottom:1px solid var(--panel-line);z-index:10;
  }
  .topbar .brand{
    font-family:var(--font-ar);color:var(--parchment);font-size:1.15rem;font-weight:700;
    direction:rtl;white-space:nowrap;
  }
  .topbar .brand small{
    display:block;font-family:var(--font-ui);color:var(--muted-text);
    font-size:.62rem;font-weight:400;letter-spacing:.04em;direction:ltr;
  }
  .topbar .spacer{flex:1;}

  .harakat-toggle{
    display:flex;align-items:center;gap:8px;color:var(--muted-text);
    font-family:var(--font-ui);font-size:.72rem;white-space:nowrap;
  }
  .harakat-toggle .harakat-label{direction:rtl;}
  .switch{position:relative;display:inline-block;width:36px;height:20px;flex:0 0 auto;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch-slider{
    position:absolute;inset:0;cursor:pointer;background:var(--ink-2);
    border:1px solid var(--panel-line);border-radius:20px;transition:.15s;
  }
  .switch-slider::before{
    content:"";position:absolute;height:14px;width:14px;left:2px;top:2px;
    background:var(--muted-text);border-radius:50%;transition:.15s;
  }
  .switch input:checked + .switch-slider{background:var(--gold-soft);border-color:var(--gold);}
  .switch input:checked + .switch-slider::before{transform:translateX(16px);background:var(--parchment);}

  #menuToggle{
    display:none;background:none;border:1px solid var(--panel-line);
    color:var(--soft-text);border-radius:3px;width:38px;height:38px;
    cursor:pointer;font-size:1.1rem;
  }

  .main-row{flex:1;display:flex;min-height:0;}

  #content{flex:1;min-width:0;overflow-y:auto;background:var(--parchment);color:var(--ink-text);}
  .content-inner{max-width:820px;margin:0 auto;padding:34px 40px 90px;}

  .book-header{margin-bottom:22px;}
  .book-eyebrow{
    font-family:var(--font-ui);font-size:.7rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px;
  }
  .book-title-row{display:flex;align-items:center;gap:12px;}
  .book-title-ar{
    font-family:var(--font-ar);font-size:2.1rem;font-weight:700;
    direction:rtl;color:var(--ink-text);margin:0 0 4px;flex:1;min-width:0;
  }
  .book-title-id{font-family:var(--font-id);font-style:italic;color:#3d6560;font-size:1rem;margin:0;}

  .book-source-link{
    display:inline-block;margin-top:10px;font-family:var(--font-ui);font-size:.76rem;
    color:#2f7671;text-decoration:none;border-bottom:1px dotted #2f7671;
  }
  .book-source-link:hover{color:var(--rubric);border-color:var(--rubric);}

  .sec-play-btn{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    background:var(--rubric);color:#fff;border:none;cursor:pointer;
    font-size:.8rem;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(28,125,120,.3);
    transition:background .15s, transform .1s;padding:0;
  }
  .sec-play-btn:hover{background:#154842;}
  .sec-play-btn:active{transform:scale(.92);}
  .sec-play-btn.active{background:var(--gold);box-shadow:0 2px 6px rgba(63,164,160,.4);}

  .para{margin:0 0 20px;padding:12px 14px;border-radius:6px;cursor:pointer;border:1px solid transparent;}
  .para.no-audio{cursor:default;}
  .para:hover{background:rgba(63,164,160,.10);}
  .para.active{background:#dcf1ee;border-color:var(--gold-soft);}
  .para-ar{
    font-family:var(--font-ar);font-size:1.55rem;line-height:2.2;
    direction:rtl;text-align:right;color:var(--ink-text);margin-bottom:8px;
  }
  .para-id{font-family:var(--font-id);font-size:.98rem;line-height:1.75;color:#23453f;padding-inline-start:14px;}
  .para-id.placeholder{color:#8fb0ac;font-style:italic;}
  .para-note{
    font-family:var(--font-id);font-size:.8rem;line-height:1.6;color:#5c7d78;
    padding-inline-start:14px;margin-top:8px;padding-top:8px;
    border-top:1px dashed #cfe4de;
  }
  .para-note b{color:#3d6b64;font-weight:600;display:block;margin-bottom:6px;}
  .fn-list{list-style:decimal;margin:0;padding-inline-start:20px;}
  .fn-list li{margin-bottom:8px;}
  .fn-list li:last-child{margin-bottom:0;}
  .fn-ar{
    display:block;font-family:var(--font-ar);font-size:1.05rem;line-height:1.7;
    direction:rtl;text-align:right;color:#3d6b64;margin-bottom:2px;
  }
  .fn-id{display:block;color:#5c7d78;}

  .empty-state{
    margin-top:20px;padding:26px 24px;border:1px dashed #a9d1cb;border-radius:6px;
    background:#edf7f4;text-align:center;
  }
  .empty-state .icon{font-size:1.6rem;margin-bottom:8px;}
  .empty-state h3{margin:0 0 6px;font-family:var(--font-ui);font-size:.95rem;color:#1c453f;}
  .empty-state p{
    margin:0;font-family:var(--font-id);font-size:.88rem;color:#4a6f69;
    max-width:440px;margin:0 auto;line-height:1.6;
  }
  .empty-state a{color:var(--rubric);text-decoration:none;border-bottom:1px dotted var(--rubric);}

  /* ---------- SIDEBAR ---------- */
  #sidebar{flex:0 0 300px;width:300px;background:var(--panel);border-left:1px solid var(--panel-line);overflow-y:auto;order:2;display:flex;flex-direction:column;}
  .sidebar-search{position:sticky;top:0;background:var(--panel);padding:14px 14px 10px;border-bottom:1px solid var(--panel-line);z-index:2;}
  .sidebar-search input{
    width:100%;padding:9px 10px;background:var(--ink-2);border:1px solid var(--panel-line);
    border-radius:3px;color:var(--soft-text);font-family:var(--font-ui);font-size:.85rem;outline:none;
  }
  .sidebar-search input:focus{border-color:var(--gold);}
  ul.book-list{list-style:none;margin:0;padding:6px 8px 24px;flex:1;}
  ul.book-list li{margin-bottom:2px;}
  .book-link{
    display:flex;align-items:center;gap:10px;width:100%;text-align:right;
    background:none;border:none;cursor:pointer;padding:9px 10px;border-radius:4px;
    color:var(--muted-text);font-family:var(--font-ui);font-size:.85rem;
    transition:background .12s, color .12s;
  }
  .book-link:hover{background:rgba(63,164,160,.16);color:var(--soft-text);}
  .book-link.active{background:rgba(63,164,160,.22);color:var(--parchment);}
  .book-link.has-content .book-num{border-color:var(--gold);}
  .book-num{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--panel-line);
    display:flex;align-items:center;justify-content:center;font-size:.66rem;color:var(--gold-soft);
  }
  .book-link.active .book-num{border-color:var(--gold);color:var(--gold);}
  .book-names{flex:1;min-width:0;text-align:left;}
  .book-name-ar{font-family:var(--font-ar);font-size:.95rem;direction:rtl;text-align:right;display:block;line-height:1.3;}
  .book-name-id{display:block;font-size:.67rem;color:var(--muted-text);margin-top:1px;}

  .sidebar-note{
    flex:0 0 auto;font-family:var(--font-id);font-size:.66rem;line-height:1.6;color:var(--muted-text);
    padding:12px 14px 16px;border-top:1px solid var(--panel-line);background:var(--panel);
  }

  #sidebarBackdrop{display:none;}

  /* ---------- PLAYER BAR ---------- */
  .player-bar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;
    height:60px;padding:0 16px;background:var(--panel);border-top:1px solid var(--panel-line);z-index:10;
  }
  .player-toggle{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--gold);
    color:#062522;border:none;cursor:pointer;font-size:.85rem;
    display:flex;align-items:center;justify-content:center;transition:background .15s, transform .1s;
  }
  .player-toggle:hover{background:#5cc0bc;}
  .player-toggle:active{transform:scale(.92);}
  .player-toggle:disabled{opacity:.4;cursor:default;}
  .player-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .player-title{
    font-family:var(--font-id);font-size:.78rem;color:var(--soft-text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
    background:none;border:none;padding:0;text-align:left;
  }
  .player-title:hover{color:var(--gold);}
  .player-title:disabled{cursor:default;color:var(--muted-text);}
  .player-time{display:flex;align-items:center;gap:8px;}
  .player-time span{font-family:var(--font-ui);font-size:.66rem;color:var(--muted-text);flex:0 0 auto;width:40px;}
  .player-time span.dur{text-align:right;}
  .player-seek{
    flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
    background:var(--panel-line);outline:none;cursor:pointer;
  }
  .player-seek::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--gold);cursor:pointer;border:2px solid var(--ink);
  }
  .player-seek::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer;border:2px solid var(--ink);
  }

  @media (max-width: 860px){
    #menuToggle{display:flex;align-items:center;justify-content:center;}
    .harakat-toggle .harakat-label{display:none;}
    #sidebar{
      position:fixed;top:56px;right:0;bottom:60px;transform:translateX(100%);
      transition:transform .22s ease;z-index:40;box-shadow:-10px 0 30px rgba(0,0,0,.4);
    }
    #sidebar.open{transform:translateX(0);}
    #sidebarBackdrop.open{display:block;position:fixed;inset:56px 0 60px 0;background:rgba(0,0,0,.4);z-index:35;}
    .content-inner{padding:24px 18px 70px;}
    .book-title-ar{font-size:1.7rem;}
    .para-ar{font-size:1.32rem;}
    .player-time span{width:32px;}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <svg class="login-medallion" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="29" fill="none" stroke="#3fa4a0" stroke-width="1.4"/>
      <circle cx="32" cy="32" r="22" fill="none" stroke="#3fa4a0" stroke-width="1"/>
      <g stroke="#3fa4a0" stroke-width="1"><path d="M32 3 L32 61 M3 32 L61 32" opacity=".35"/></g>
      <circle cx="32" cy="32" r="5" fill="#1c7d78"/>
    </svg>
    <h1>حصن المسلم</h1>
    <p class="sub">Hisnul Muslim &mdash; Kumpulan Dzikir &amp; Doa dari Al-Qur'an dan As-Sunnah</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="userInput">Nama pengguna</label>
        <input id="userInput" type="text" value="muslim" autocomplete="username">
      </div>
      <div class="field">
        <label for="passInput">Kata sandi</label>
        <input id="passInput" type="password" value="hisnulmuslim" autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn">Masuk</button>
      <div id="loginError"></div>
    </form>
    <div class="login-hint">Hint: <i>muslim / hisnulmuslim</i></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="brand">حصن المسلم<small>Hisnul Muslim &middot; Sa'id bin Ali Al-Qahthani</small></div>
    <div class="spacer"></div>
    <div class="harakat-toggle" title="Tampilkan teks Arab tanpa harakat">
      <span class="harakat-label">بدون تشكيل</span>
      <label class="switch">
        <input type="checkbox" id="harakatCheckbox">
        <span class="switch-slider"></span>
      </label>
    </div>
    <button id="menuToggle" aria-label="Buka daftar menu">☰</button>
  </div>

  <div class="main-row">
    <main id="content"><div class="content-inner" id="contentInner"></div></main>

    <div id="sidebarBackdrop"></div>
    <nav id="sidebar">
      <div class="sidebar-search">
        <input id="searchBooks" type="text" placeholder="Cari doa / dzikir…">
      </div>
      <ul class="book-list" id="bookList"></ul>
      <div class="sidebar-note" id="sidebarNote"></div>
    </nav>
  </div>

  <div class="player-bar">
    <button id="playerToggle" class="player-toggle" type="button" aria-label="Putar/Jeda" disabled>▶</button>
    <div class="player-info">
      <button id="playerTitle" class="player-title" type="button" disabled>Memuat audio…</button>
      <div class="player-time">
        <span id="playerCurrent">00:00</span>
        <input id="playerSeek" class="player-seek" type="range" min="0" max="100" value="0" step="0.1">
        <span id="playerDuration" class="dur">00:00</span>
      </div>
    </div>
    <audio id="bookAudio" preload="metadata"></audio>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- LOGIN ----------
  var VALID_USER = "muslim";
  var VALID_PASS = "hisnulmuslim";

  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var u = document.getElementById("userInput").value.trim();
    var p = document.getElementById("passInput").value;
    var err = document.getElementById("loginError");
    if(u === VALID_USER && p === VALID_PASS){
      document.getElementById("loginScreen").style.display = "none";
      var app = document.getElementById("app");
      app.classList.add("active");
      initApp();
    } else {
      err.textContent = "Nama pengguna atau kata sandi salah.";
    }
  });

  // ---------- APP ----------
  var DATA = null;
  var currentBookIndex = 0;
  var initialized = false;
  var isDraggingSeek = false;

  function initApp(){
    if(initialized){ return; }
    initialized = true;
    fetch("data.json")
      .then(function(r){ return r.json(); })
      .then(function(json){
        DATA = json;
        renderSidebar();
        renderBook(0);
        setupPlayer();
      })
      .catch(function(err){
        document.getElementById("contentInner").innerHTML =
          '<div class="empty-state"><div class="icon">⚠</div><h3>Gagal memuat data.json</h3>' +
          '<p>Pastikan file <code>data.json</code> berada di folder yang sama dengan file HTML ini, ' +
          'dan halaman diakses lewat server (bukan dibuka langsung dari file://).</p></div>';
        console.error(err);
      });
  }

  function renderSidebar(){
    var list = document.getElementById("bookList");
    list.innerHTML = "";
    DATA.books.forEach(function(book, idx){
      var li = document.createElement("li");
      var btn = document.createElement("button");
      var hasContent = book.text && book.text.length > 0;
      btn.className = "book-link" + (idx === currentBookIndex ? " active" : "") + (hasContent ? " has-content" : "");
      btn.setAttribute("data-idx", idx);
      var badge = badgeForBook(book);
      btn.innerHTML =
        '<span class="book-num">' + badge + '</span>' +
        '<span class="book-names">' +
          '<span class="book-name-ar" data-ar-full="' + encodeURIComponent(book.title_ar) + '">' + escapeHtml(book.title_ar) + '</span>' +
          '<span class="book-name-id">' + book.title_id + '</span>' +
        '</span>';
      btn.addEventListener("click", function(){
        renderBook(idx);
        closeSidebarMobile();
      });
      li.appendChild(btn);
      list.appendChild(li);
    });

    var note = document.getElementById("sidebarNote");
    note.textContent = (DATA.meta && DATA.meta.source_note) ? DATA.meta.source_note : "";
  }

  function markActiveInSidebar(idx){
    var links = document.querySelectorAll(".book-link");
    links.forEach(function(el){
      el.classList.toggle("active", parseInt(el.getAttribute("data-idx"),10) === idx);
    });
  }

  function scrollBookLinkIntoView(idx){
    var link = document.querySelector('.book-link[data-idx="' + idx + '"]');
    var container = document.getElementById("sidebar");
    if(!link || !container){ return; }
    var containerRect = container.getBoundingClientRect();
    var linkRect = link.getBoundingClientRect();
    var linkTopWithinContainer = (linkRect.top - containerRect.top) + container.scrollTop;
    var targetScrollTop = linkTopWithinContainer - (containerRect.height / 2) + (linkRect.height / 2);
    container.scrollTo({ top: Math.max(targetScrollTop, 0), behavior: "smooth" });
  }

  function badgeForBook(book){
    if(/^\d+$/.test(book.id)){
      return String(parseInt(book.id, 10)).padStart(2, "0");
    }
    return "•";
  }

  function renderBook(idx){
    currentBookIndex = idx;
    var book = DATA.books[idx];
    markActiveInSidebar(idx);
    scrollBookLinkIntoView(idx);

    var badge = badgeForBook(book);
    var hasBookAudio = (book.start !== null && book.start !== undefined);

    var html = '';
    html += '<div class="book-header">';
    html += '  <div class="book-eyebrow">Menu ' + (badge !== "•" ? badge : "—") + ' &middot; ' + (idx+1) + ' dari ' + DATA.books.length + '</div>';
    html += '  <div class="book-title-row">';
    if(hasBookAudio){
      html += '    <button class="sec-play-btn" data-play-seek="' + book.start + '" aria-label="Putar/Jeda menu ini" type="button">▶</button>';
    }
    html += '    <h1 class="book-title-ar" data-ar-full="' + encodeURIComponent(book.title_ar) + '">' + escapeHtml(book.title_ar) + '</h1>';
    html += '  </div>';
    html += '  <p class="book-title-id">' + book.title_id + '</p>';
    html += '  <a class="book-source-link" href="https://www.imadislam.com/hisnulmuslim" target="_blank" rel="noopener">Rujukan teks di imadislam.com ↗</a>';
    html += '</div>';

    if(!book.text || book.text.length === 0){
      html += '<div class="empty-state">';
      html += '  <div class="icon">📜</div>';
      html += '  <h3>Teks &amp; terjemahan belum diisi</h3>';
      html += '  <p>Menu ini akan dilengkapi pada sesi berikutnya: teks Arab berharakat lengkap, ' +
              'terjemahan Indonesia, dan catatan kaki akan ditambahkan ke <code>data.json</code>.</p>';
      html += '</div>';
    } else {
      book.text.forEach(function(p){
        var hasTime = (p.start !== null && p.start !== undefined && p.end !== null && p.end !== undefined);
        var seekAttrs = hasTime ? ' data-seek="' + p.start + '" data-start="' + p.start + '" data-end="' + p.end + '"' : '';
        html += '<div class="para' + (hasTime ? '' : ' no-audio') + '"' + seekAttrs + '>';
        html += '  <div class="para-ar" data-ar-full="' + encodeURIComponent(p.ar || '') + '">' + escapeHtml(p.ar || '') + '</div>';
        html += '  <div class="para-id' + (p.id ? '' : ' placeholder') + '">' + (p.id || 'Terjemahan belum diisi.') + '</div>';
        html += renderFootnotes(p);
        html += '</div>';
      });
    }

    document.getElementById("contentInner").innerHTML = html;
    document.getElementById("content").scrollTop = 0;
    lastActiveAnchorEl = null;
    applyGundulMode();
    wireSeekableElements();
    wireBookPlayButton();
    var audioEl = document.getElementById("bookAudio");
    if(audioEl){ updatePlaybackUI(audioEl.currentTime, !audioEl.paused, false); }
  }

  function renderFootnotes(p){
    var fnAr = p.footnote_ar || [];
    var fnId = p.footnote_id || [];
    var count = Math.max(fnAr.length, fnId.length);
    if(count === 0){ return ''; }
    var html = '<div class="para-note"><b>Takhrij / catatan:</b><ol class="fn-list">';
    for(var i = 0; i < count; i++){
      var ar = fnAr[i] || '';
      var id = fnId[i] || '';
      html += '<li>';
      if(ar){
        html += '<span class="fn-ar" data-ar-full="' + encodeURIComponent(ar) + '">' + escapeHtml(ar) + '</span>';
      }
      if(id){
        html += '<span class="fn-id">' + id + '</span>';
      }
      html += '</li>';
    }
    html += '</ol></div>';
    return html;
  }

  // ---------- CUSTOM AUDIO PLAYER (single continuous file for whole kitab) ----------
  function setupPlayer(){
    var audioEl = document.getElementById("bookAudio");
    var toggleBtn = document.getElementById("playerToggle");
    var titleBtn = document.getElementById("playerTitle");
    var seekEl = document.getElementById("playerSeek");

    if(!DATA.meta || !DATA.meta.audio_base){
      titleBtn.textContent = "Audio tidak tersedia";
      return;
    }
    audioEl.src = DATA.meta.audio_base;
    toggleBtn.disabled = false;
    titleBtn.disabled = false;
    titleBtn.textContent = "—";

    audioEl.addEventListener("loadedmetadata", function(){
      seekEl.max = audioEl.duration || 0;
      document.getElementById("playerDuration").textContent = formatTime(audioEl.duration);
    });
    audioEl.addEventListener("play", function(){ updatePlaybackUI(audioEl.currentTime, true); });
    audioEl.addEventListener("pause", function(){ updatePlaybackUI(audioEl.currentTime, false); });
    audioEl.addEventListener("ended", function(){ updatePlaybackUI(audioEl.currentTime, false); });
    audioEl.addEventListener("timeupdate", function(){
      updatePlaybackUI(audioEl.currentTime, !audioEl.paused);
    });

    toggleBtn.addEventListener("click", function(){
      if(audioEl.paused){ audioEl.play(); } else { audioEl.pause(); }
    });

    titleBtn.addEventListener("click", function(){
      var activeIdx = getActiveBookIndexForTime(audioEl.currentTime);
      if(activeIdx >= 0 && activeIdx !== currentBookIndex){
        renderBook(activeIdx);
      }
    });

    seekEl.addEventListener("pointerdown", function(){ isDraggingSeek = true; });
    seekEl.addEventListener("pointerup", function(){ isDraggingSeek = false; });
    seekEl.addEventListener("input", function(){
      if(!isNaN(audioEl.duration)){
        audioEl.currentTime = parseFloat(seekEl.value);
      }
    });
  }

  function formatTime(t){
    if(isNaN(t) || t == null){ return "00:00"; }
    t = Math.max(0, Math.floor(t));
    var h = Math.floor(t / 3600);
    var m = Math.floor((t % 3600) / 60);
    var s = t % 60;
    var pad = function(n){ return String(n).padStart(2, "0"); };
    if(h > 0){
      return h + ":" + pad(m) + ":" + pad(s);
    }
    return pad(m) + ":" + pad(s);
  }

  function wireSeekableElements(){
    var audioEl = document.getElementById("bookAudio");
    document.querySelectorAll("[data-seek]").forEach(function(el){
      el.addEventListener("click", function(){
        var t = parseFloat(el.getAttribute("data-seek"));
        if(audioEl && !isNaN(t)){
          audioEl.currentTime = t;
          audioEl.play();
        }
      });
    });
  }

  function wireBookPlayButton(){
    var audioEl = document.getElementById("bookAudio");
    var btn = document.querySelector(".sec-play-btn");
    if(!btn){ return; }
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      var seek = parseFloat(btn.getAttribute("data-play-seek"));
      if(!audioEl || isNaN(seek)){ return; }
      if(!audioEl.paused && Math.abs(audioEl.currentTime - seek) < 1.5){
        audioEl.pause();
      } else {
        audioEl.currentTime = seek;
        audioEl.play();
      }
    });
  }

  function getActiveBookIndexForTime(t){
    var activeIdx = -1;
    DATA.books.forEach(function(b, i){
      if(b.start !== null && b.start !== undefined && b.start <= t){ activeIdx = i; }
    });
    return activeIdx;
  }

  function updatePlaybackUI(t, isPlaying, allowAutoSwitch){
    var switchIdx = getActiveBookIndexForTime(t);
    if(allowAutoSwitch !== false && switchIdx >= 0 && switchIdx !== currentBookIndex){
      // Playback (baik karena berjalan terus maupun karena seek/player-time digeser)
      // sudah masuk ke book lain: buka book itu otomatis lalu lanjutkan sinkronisasi UI.
      renderBook(switchIdx);
      return;
    }

    highlightActiveParagraph(t);

    var toggleBtn = document.getElementById("playerToggle");
    toggleBtn.textContent = isPlaying ? "❚❚" : "▶";

    if(!isDraggingSeek){
      document.getElementById("playerSeek").value = t;
      document.getElementById("playerCurrent").textContent = formatTime(t);
    }

    var activeIdx = getActiveBookIndexForTime(t);
    var titleBtn = document.getElementById("playerTitle");
    if(activeIdx >= 0){
      titleBtn.textContent = "Sedang diputar: " + DATA.books[activeIdx].title_id;
    }

    var bookBtn = document.querySelector(".sec-play-btn[data-play-seek]");
    if(bookBtn){
      var seek = parseFloat(bookBtn.getAttribute("data-play-seek"));
      var isActive = isPlaying && !isNaN(seek) && Math.abs(t - seek) < 9999 && activeIdx === currentBookIndex;
      bookBtn.textContent = isActive ? "❚❚" : "▶";
      bookBtn.classList.toggle("active", isActive);
    }
  }

  var lastActiveAnchorEl = null;

  function highlightActiveParagraph(t){
    var paras = document.querySelectorAll(".para[data-start]");
    paras.forEach(function(el){
      var start = parseFloat(el.getAttribute("data-start"));
      var end = parseFloat(el.getAttribute("data-end"));
      var isActive = t >= start && t < end;
      el.classList.toggle("active", isActive);
    });

    var activeAnchor = getActiveTimeAnchor(t);
    if(activeAnchor && activeAnchor !== lastActiveAnchorEl){
      lastActiveAnchorEl = activeAnchor;
      scrollParaIntoView(activeAnchor);
    } else if(!activeAnchor){
      lastActiveAnchorEl = null;
    }
  }

  function getActiveTimeAnchor(t){
    var anchors = document.querySelectorAll(".para[data-start]");
    var active = null;
    anchors.forEach(function(el){
      var start = parseFloat(el.getAttribute("data-start"));
      if(!isNaN(start) && start <= t){
        active = el;
      }
    });
    return active;
  }

  function scrollParaIntoView(el){
    var container = document.getElementById("content");
    if(!container){ return; }
    var containerRect = container.getBoundingClientRect();
    var elRect = el.getBoundingClientRect();
    var elTopWithinContainer = (elRect.top - containerRect.top) + container.scrollTop;
    var targetOffset = containerRect.height * 0.28;
    var targetScrollTop = elTopWithinContainer - targetOffset;
    container.scrollTo({ top: Math.max(targetScrollTop, 0), behavior: "smooth" });
  }

  // ---------- ARABIC TEXT HELPERS (gundul / no-harakat toggle) ----------
  var GUNDUL = (localStorage.getItem("hisnulmuslim_gundul") === "1");

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function stripHarakat(s){
    return String(s).replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u08D4-\u08E1\u08E3-\u08FF\uFC5E-\uFC63\uFE70-\uFE7F]/g, "");
  }

  function applyGundulMode(){
    document.querySelectorAll("[data-ar-full]").forEach(function(el){
      var full = decodeURIComponent(el.getAttribute("data-ar-full"));
      el.textContent = GUNDUL ? stripHarakat(full) : full;
    });
  }

  var harakatCheckbox = document.getElementById("harakatCheckbox");
  harakatCheckbox.checked = GUNDUL;
  harakatCheckbox.addEventListener("change", function(){
    GUNDUL = harakatCheckbox.checked;
    localStorage.setItem("hisnulmuslim_gundul", GUNDUL ? "1" : "0");
    applyGundulMode();
  });

  // ---------- SIDEBAR (mobile toggle) ----------
  var sidebar = document.getElementById("sidebar");
  var backdrop = document.getElementById("sidebarBackdrop");
  document.getElementById("menuToggle").addEventListener("click", function(){
    sidebar.classList.toggle("open");
    backdrop.classList.toggle("open");
  });
  backdrop.addEventListener("click", closeSidebarMobile);
  function closeSidebarMobile(){
    sidebar.classList.remove("open");
    backdrop.classList.remove("open");
  }

  // ---------- SEARCH ----------
  document.getElementById("searchBooks").addEventListener("input", function(e){
    var q = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".book-link").forEach(function(el){
      var txt = el.textContent.toLowerCase();
      el.parentElement.style.display = txt.indexOf(q) !== -1 ? "" : "none";
    });
  });

})();
</script>
</body>
</html>
